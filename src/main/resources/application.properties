# =====================================================
# Quan Ly Dang Ky Hoc Phan - Application Properties
# =====================================================

# ---- Server ----
server.port=8080

# ---- DataSource (XAMPP MySQL) ----
spring.datasource.url=jdbc:mysql://localhost:3306/quan_ly_hoc_phan?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP - mac dinh cua Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ---- JPA / Hibernate ----
# validate: Hibernate kiem tra schema co khop Entity khong (KHONG tu tao/xoa bang)
# Sau khi chay schema.sql tay trong XAMPP, su dung validate hoac none
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ---- Encoding ----
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ---- Logging ----
logging.level.vn.edu.quanlyhocphan=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
