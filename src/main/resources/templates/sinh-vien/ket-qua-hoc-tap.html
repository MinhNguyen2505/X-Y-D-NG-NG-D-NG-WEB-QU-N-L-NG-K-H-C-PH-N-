<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Kết quả học tập</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="layout">
  <div th:insert="~{fragments/sidebar :: sv('sv-kqht')}"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title">Kết quả học tập</div>
      <div class="topbar-user">
        <div class="topbar-avatar" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</div>
        <span class="topbar-name" th:text="${sinhVien?.hoTen ?: #authentication.name}">SV</span>
      </div>
    </header>
    <div class="content">

      <!-- GPA + Tín chỉ banner -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;">
        <div style="background:linear-gradient(135deg,#15803d,#166534);border-radius:10px;
                    padding:18px 24px;color:#fff;display:flex;align-items:center;gap:18px;">
          <div style="font-size:44px;">🏆</div>
          <div>
            <div style="font-size:12px;opacity:.8;">Điểm trung bình tổng kết</div>
            <div style="font-size:34px;font-weight:800;" th:text="${gpa}">0.00</div>
            <div style="font-size:12px;opacity:.7;">Tính trên môn có điểm tổng kết</div>
          </div>
        </div>
        <div style="background:linear-gradient(135deg,#1a56db,#0c2494);border-radius:10px;
                    padding:18px 24px;color:#fff;display:flex;align-items:center;gap:18px;">
          <div style="font-size:44px;">📊</div>
          <div>
            <div style="font-size:12px;opacity:.8;">Tín chỉ tích lũy (môn đạt ≥ 5)</div>
            <div style="font-size:34px;font-weight:800;" th:text="${tinChiTichLuy}">0</div>
            <div style="font-size:12px;opacity:.7;">
              <a th:href="@{/sinh-vien/tin-chi-tich-luy}" style="color:#93c5fd;">
                Xem chi tiết →
              </a>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">
            <i class="fa-solid fa-table" style="color:var(--primary);margin-right:6px;"></i>
            Lịch sử học tập
          </span>
          <a th:href="@{/sinh-vien/dang-ky-thi-lai}" class="btn btn-outline btn-sm">
            <i class="fa-solid fa-rotate-right"></i> Đăng ký thi lại
          </a>
        </div>
        <div class="card-body" style="padding:0;">
          <div th:if="${lichSu == null or lichSu.empty}" class="empty-state">
            <i class="fa-solid fa-inbox"></i>Chưa có dữ liệu học tập.
          </div>
          <table th:if="${lichSu != null and !lichSu.empty}" class="table">
            <thead>
              <tr>
                <th>Học kỳ</th>
                <th>Môn học</th>
                <th style="text-align:center;">TC</th>
                <th style="text-align:center;">Điểm GK</th>
                <th style="text-align:center;">Điểm CK</th>
                <th style="text-align:center;">Điểm TK</th>
                <th style="text-align:center;">Kết quả</th>
                <th style="text-align:center;">Thi lại</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="dk : ${lichSu}"
                  th:if="${dk.trangThai.name() != 'DA_HUY'}"
                  th:with="tl=${thiLaiMap != null ? thiLaiMap[dk.id] : null}">
                <td style="white-space:nowrap;font-size:12px;"
                    th:text="${dk.lopHocPhan.hocKy.tenHocKy}"></td>
                <td>
                  <span th:text="${dk.lopHocPhan.monHoc.tenMon}"></span><br/>
                  <small class="text-muted" th:text="${dk.lopHocPhan.monHoc.maMon}"></small>
                </td>
                <td style="text-align:center;" th:text="${dk.lopHocPhan.monHoc.soTinChi}"></td>
                <td style="text-align:center;"
                    th:text="${dk.diemGiuaKy != null ? dk.diemGiuaKy : '—'}"></td>
                <td style="text-align:center;"
                    th:text="${dk.diemCuoiKy != null ? dk.diemCuoiKy : '—'}"></td>
                <td style="text-align:center;">
                  <b th:text="${dk.diemTongKet != null ? dk.diemTongKet : '—'}"
                     th:style="${dk.diemTongKet != null and dk.diemTongKet < 5}
                               ? 'color:var(--danger);' :
                               (dk.diemTongKet != null ? 'color:var(--success);' : '')"></b>
                </td>
                <td style="text-align:center;">
                  <span th:if="${dk.diemTongKet == null}"
                        class="badge badge-secondary">Chưa có điểm</span>
                  <span th:if="${dk.diemTongKet != null and dk.diemTongKet >= 5}"
                        class="badge badge-success">Đạt</span>
                  <span th:if="${dk.diemTongKet != null and dk.diemTongKet < 5}"
                        class="badge badge-danger">Không đạt</span>
                </td>
                <!-- Cột thi lại: chỉ hiện khi điểm < 5 -->
                <td style="text-align:center;">
                  <th:block th:if="${dk.diemTongKet != null and dk.diemTongKet < 5}">
                    <!-- Đã đăng ký và còn hiệu lực -->
                    <span th:if="${tl != null and tl.trangThai != 'DA_HUY'}">
                      <span th:if="${tl.trangThai == 'CHO_DUYET'}"
                            class="badge badge-warning" style="font-size:10px;">
                        <i class="fa-solid fa-clock"></i> Chờ duyệt
                      </span>
                      <span th:if="${tl.trangThai == 'DA_DUYET'}"
                            class="badge badge-success" style="font-size:10px;">
                        <i class="fa-solid fa-check"></i> Đã duyệt
                      </span>
                    </span>
                    <!-- Chưa đăng ký hoặc đã hủy: nút đăng ký -->
                    <form th:if="${tl == null or tl.trangThai == 'DA_HUY'}"
                          th:action="@{/sinh-vien/dang-ky-thi-lai}" method="post">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <input type="hidden" name="dangKyHocPhanId" th:value="${dk.id}"/>
                      <button type="submit" class="btn btn-danger btn-sm"
                              style="font-size:11px;padding:3px 8px;">
                        <i class="fa-solid fa-rotate-right"></i> Thi lại
                      </button>
                    </form>
                  </th:block>
                  <!-- Không cần thi lại hoặc chưa có điểm -->
                  <span th:if="${dk.diemTongKet == null or dk.diemTongKet >= 5}"
                        style="color:var(--gray-300);">—</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
