<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Tín chỉ tích lũy</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .prog-wrap { background:var(--gray-200); border-radius:20px; height:10px; overflow:hidden; margin-top:6px; }
    .prog-bar  { height:100%; border-radius:20px; background:linear-gradient(90deg,var(--primary),#38bdf8); transition:width .5s ease; }
    .d-a  { color:#16a34a; font-weight:800; }
    .d-b  { color:#2563eb; font-weight:800; }
    .d-c  { color:#d97706; font-weight:800; }
    .d-d  { color:#9333ea; font-weight:800; }
    .d-f  { color:#dc2626; font-weight:800; }
    .d-null { color:var(--gray-400); }
  </style>
</head>
<body>
<div class="layout">
  <div th:insert="~{fragments/sidebar :: sv('sv-tin-chi')}"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title">Tín chỉ tích lũy</div>
      <div class="topbar-user">
        <div class="topbar-avatar" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</div>
        <span class="topbar-name" th:text="${sinhVien?.hoTen ?: #authentication.name}">SV</span>
      </div>
    </header>
    <div class="content">

      <div th:if="${errorMsg}" class="flash flash-danger">
        <i class="fa-solid fa-circle-exclamation"></i><span th:text="${errorMsg}"></span>
      </div>

      <div th:if="${danhSachKhoi != null}">

        <!-- ===== STAT CARDS ===== -->
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px;">

          <div style="background:linear-gradient(135deg,#1a56db,#0c2494);border-radius:10px;padding:18px 20px;color:#fff;">
            <div style="font-size:12px;opacity:.8;">Tín chỉ đã tích lũy</div>
            <div style="font-size:36px;font-weight:800;" th:text="${tongTichLuy}">0</div>
            <div style="font-size:12px;opacity:.7;">trên <span th:text="${tongYeuCau}"></span> TC yêu cầu</div>
            <div class="prog-wrap" style="margin-top:10px;">
              <div class="prog-bar" th:style="'width:' + ${phanTramInt} + '%'"></div>
            </div>
            <div style="font-size:11px;opacity:.7;text-align:right;margin-top:3px;" th:text="${phanTramTichLuy}"></div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Tổng TC chương trình</div>
            <div class="stat-val" th:text="${tongYeuCau}">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">TC bắt buộc</div>
            <div class="stat-val" th:text="${tongBatBuoc}">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Còn cần tích lũy</div>
            <div class="stat-val"
                 th:text="${tongYeuCau - tongTichLuy > 0 ? tongYeuCau - tongTichLuy : 0}"
                 th:style="${tongYeuCau - tongTichLuy > 0} ? 'color:var(--danger);' : 'color:var(--success);'">0</div>
          </div>

        </div>

        <!-- ===== BẢNG CTDT PHẲNG THEO HỌC KỲ ===== -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">
              <i class="fa-solid fa-list-check" style="color:var(--primary);margin-right:6px;"></i>
              Chương trình đào tạo
              <span style="font-size:12px;color:var(--gray-500);margin-left:8px;"
                    th:text="'(' + ${tongMon} + ' môn)'"></span>
            </span>
          </div>
          <div style="overflow-x:auto;">
            <table class="table" style="min-width:680px;">
              <thead>
                <tr>
                  <th style="width:36px;text-align:center;">STT</th>
                  <th style="width:82px;">Mã HP</th>
                  <th>Tên học phần</th>
                  <th style="text-align:center;width:46px;">TC</th>
                  <th style="text-align:center;width:46px;">Loại</th>
                  <th style="text-align:center;width:70px;">Điểm TK</th>
                  <th style="text-align:center;width:54px;">Chữ</th>
                  <th style="text-align:center;width:100px;">Kết quả</th>
                </tr>
              </thead>
              <tbody>
                <th:block th:each="khoi : ${danhSachKhoi}">
                  <!-- Header khối -->
                  <tr style="background:linear-gradient(90deg,#dbeafe,#eff6ff);">
                    <td colspan="8" style="font-weight:700;font-size:12px;color:var(--navy);
                                           padding:7px 12px;border-top:2px solid var(--primary);">
                      <i class="fa-solid fa-layer-group" style="margin-right:5px;color:var(--primary);"></i>
                      <span th:text="${khoi.maKhoi}"></span>
                      — <span th:text="${khoi.tenKhoi}"></span>
                      <span style="margin-left:12px;background:#fff;border-radius:20px;padding:1px 10px;
                                   font-size:11px;color:var(--primary);">
                        <b th:text="${khoi.tinChiDaTichLuy}"></b>/<span th:text="${khoi.tongSoTinChi}"></span> TC
                      </span>
                    </td>
                  </tr>
                  <!-- Từng môn trong khối -->
                  <tr th:each="mon : ${khoi.danhSachMon}"
                      th:style="${mon.ketQua == 'Không đạt'} ? 'background:#fff5f5;' : ''">
                    <td style="text-align:center;color:var(--gray-400);" th:text="${mon.stt}"></td>
                    <td><code style="font-size:11px;" th:text="${mon.maMon}"></code></td>
                    <td th:text="${mon.tenMon}"></td>
                    <td style="text-align:center;">
                      <span class="badge badge-secondary" th:text="${mon.soTinChi}"></span>
                    </td>
                    <td style="text-align:center;font-size:11px;">
                      <span th:if="${mon.batBuoc}" style="color:var(--danger);">BB</span>
                      <span th:if="${!mon.batBuoc}" style="color:var(--gray-400);">TC</span>
                    </td>
                    <td style="text-align:center;">
                      <span th:if="${mon.diem != null}"
                            th:text="${mon.diem}"
                            th:style="${mon.diem != null and mon.diem >= 5 ? 'color:var(--success);font-weight:700;' : 'color:var(--danger);font-weight:700;'}"></span>
                      <span th:if="${mon.diem == null}" style="color:var(--gray-400);">—</span>
                    </td>
                    <td style="text-align:center;font-weight:800;">
                      <span th:if="${mon.diemChu != null and mon.diemChu != ''}"
                            th:text="${mon.diemChu}"
                            th:style="${mon.diemChu == 'F' ? 'color:#dc2626;' : (mon.diem != null and mon.diem >= 5 ? 'color:#15803d;' : 'color:#6b7280;')}"></span>
                      <span th:if="${mon.diemChu == null or mon.diemChu == ''}"
                            style="color:var(--gray-400);">—</span>
                    </td>
                    <td style="text-align:center;">
                      <span th:if="${mon.ketQua == 'Hoàn thành'}" class="badge badge-success" style="font-size:10px;">
                        <i class="fa-solid fa-check"></i> Đạt
                      </span>
                      <span th:if="${mon.ketQua == 'Không đạt'}" class="badge badge-danger" style="font-size:10px;">
                        <i class="fa-solid fa-xmark"></i> Không đạt
                      </span>
                      <span th:if="${mon.ketQua == 'Đang học'}" class="badge badge-secondary" style="font-size:10px;">
                        <i class="fa-solid fa-spinner"></i> Đang học
                      </span>
                      <span th:if="${mon.ketQua == 'Chưa học'}" style="color:var(--gray-300);font-size:11px;">Chưa học</span>
                    </td>
                  </tr>
                </th:block>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
</body>
</html>
