<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Đăng ký định hướng học tập</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="layout">
  <div th:insert="~{fragments/sidebar :: sv('sv-dinh-huong')}"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title">Đăng ký định hướng học tập</div>
      <div class="topbar-user">
        <div class="topbar-avatar" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</div>
        <span class="topbar-name" th:text="${sinhVien?.hoTen ?: #authentication.name}">SV</span>
      </div>
    </header>
    <div class="content">
      <div class="card">
        <div class="card-body" style="text-align:center;padding:48px;">
          <div style="font-size:56px;margin-bottom:16px;">🧭</div>
          <div style="font-size:18px;font-weight:700;color:var(--navy);margin-bottom:8px;">Đăng ký định hướng học tập</div>
          <div style="color:var(--gray-500);font-size:14px;">Chức năng này chưa được mở trong học kỳ hiện tại.</div>
          <div style="margin-top:24px;">
            <a th:href="@{/sinh-vien/dashboard}" class="btn btn-primary">
              <i class="fa-solid fa-arrow-left"></i> Quay về trang chủ
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
