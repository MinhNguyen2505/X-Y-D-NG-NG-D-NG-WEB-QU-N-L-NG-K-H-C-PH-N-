<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Tra cứu kết quả đăng ký</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="layout">
  <div th:insert="~{fragments/sidebar :: sv('sv-tra-cuu')}"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title">Tra cứu kết quả đăng ký</div>
      <div class="topbar-user">
        <div class="topbar-avatar" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">U</div>
        <span class="topbar-name" th:text="${sinhVien?.hoTen ?: #authentication.name}">SV</span>
      </div>
    </header>
    <div class="content">

      <!-- Thông tin sinh viên -->
      <div style="background:var(--white);border-radius:10px;padding:14px 18px;margin-bottom:18px;
                  border:1px solid var(--gray-200);display:flex;align-items:center;gap:14px;">
        <div style="font-size:36px;">🔍</div>
        <div>
          <div style="font-size:15px;font-weight:700;color:var(--navy);"
               th:text="${sinhVien?.hoTen}">Họ tên</div>
          <div style="font-size:13px;color:var(--gray-500);"
               th:text="'MSSV: ' + ${sinhVien?.mssv} + ' | ' + ${sinhVien?.nganh?.tenNganh}"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">
            <i class="fa-solid fa-list-check" style="color:var(--primary);margin-right:6px;"></i>
            Toàn bộ kết quả đăng ký học phần
          </span>
          <span style="font-size:12px;color:var(--gray-500);"
                th:text="${lichSu?.size()} + ' bản ghi'"></span>
        </div>
        <div class="card-body" style="padding:0;">
          <div th:if="${lichSu == null or lichSu.empty}" class="empty-state">
            <i class="fa-solid fa-inbox"></i>Chưa có lịch sử đăng ký nào.
          </div>
          <table th:if="${lichSu != null and !lichSu.empty}" class="table">
            <thead>
              <tr>
                <th>Học kỳ</th>
                <th>Môn học</th>
                <th>Mã lớp</th>
                <th>TC</th>
                <th>Ngày ĐK</th>
                <th>Trạng thái</th>
                <th>Điểm TK</th>
                <th>Kết quả</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="dk : ${lichSu}">
                <td style="white-space:nowrap;" th:text="${dk.lopHocPhan.hocKy.tenHocKy}"></td>
                <td th:text="${dk.lopHocPhan.monHoc.tenMon}"></td>
                <td><code th:text="${dk.lopHocPhan.maLopHp}"></code></td>
                <td th:text="${dk.lopHocPhan.monHoc.soTinChi}"></td>
                <td th:text="${#temporals.format(dk.ngayDangKy,'dd/MM/yyyy')}"></td>
                <td>
                  <span th:if="${dk.trangThai.name() == 'DA_DANG_KY'}" class="badge badge-success">Đã đăng ký</span>
                  <span th:if="${dk.trangThai.name() == 'DA_HUY'}"     class="badge badge-danger">Đã hủy</span>
                  <span th:if="${dk.trangThai.name() == 'HOAN_THANH'}" class="badge badge-primary">Hoàn thành</span>
                </td>
                <td>
                  <b th:text="${dk.diemTongKet != null ? dk.diemTongKet : '—'}"
                     th:style="${dk.diemTongKet != null and dk.diemTongKet < 5} ? 'color:var(--danger);' :
                                (dk.diemTongKet != null ? 'color:var(--success);' : '')"></b>
                </td>
                <td>
                  <span th:if="${dk.diemTongKet == null}"                         class="badge badge-secondary">Chưa có điểm</span>
                  <span th:if="${dk.diemTongKet != null and dk.diemTongKet >= 5}" class="badge badge-success">Đạt</span>
                  <span th:if="${dk.diemTongKet != null and dk.diemTongKet < 5}"  class="badge badge-danger">Không đạt</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
