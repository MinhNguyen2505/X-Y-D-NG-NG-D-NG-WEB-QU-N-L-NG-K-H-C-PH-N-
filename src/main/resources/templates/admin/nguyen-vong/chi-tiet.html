<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Chi tiết kế hoạch nguyện vọng</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="layout">
  <div th:insert="~{fragments/sidebar :: admin('admin-nv')}"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title" th:text="${keHoach.tenKeHoach}">Chi tiết</div>
    </header>
    <div class="content">
      <div th:if="${successMsg}" class="flash flash-success"><i class="fa-solid fa-circle-check"></i><span th:text="${successMsg}"></span></div>
      <div th:if="${errorMsg}"   class="flash flash-danger"><i class="fa-solid fa-circle-exclamation"></i><span th:text="${errorMsg}"></span></div>

      <!-- Header -->
      <div class="page-hd">
        <div>
          <div class="page-hd-title" th:text="${keHoach.tenKeHoach}">Tên kế hoạch</div>
          <div class="page-hd-sub">
            <span th:text="${keHoach.hocKy.tenHocKy}"></span>
            <span style="color:var(--gray-400);"> • </span>
            <span th:text="${#temporals.format(keHoach.ngayBatDau,'dd/MM/yyyy')}"></span>
            <span style="color:var(--gray-400);"> — </span>
            <span th:text="${#temporals.format(keHoach.ngayKetThuc,'dd/MM/yyyy')}"></span>
          </div>
        </div>
        <div class="flex">
          <!-- Nút mở/đóng kế hoạch -->
          <form th:if="${keHoach.trangThai == 'DANG_MO'}"
                th:action="@{/admin/nguyen-vong/{id}/dong(id=${keHoach.id})}" method="post">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-danger"
                    onclick="return confirm('Đóng kế hoạch? Sinh viên sẽ không thể đăng ký nữa.')">
              <i class="fa-solid fa-lock"></i> Đóng kế hoạch
            </button>
          </form>
          <form th:if="${keHoach.trangThai == 'DA_DONG'}"
                th:action="@{/admin/nguyen-vong/{id}/mo(id=${keHoach.id})}" method="post">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-success">
              <i class="fa-solid fa-lock-open"></i> Mở lại
            </button>
          </form>
          <a th:href="@{/admin/nguyen-vong}" class="btn btn-outline">
            <i class="fa-solid fa-arrow-left"></i> Quay lại
          </a>
        </div>
      </div>

      <!-- Status badge -->
      <div style="margin-bottom:16px;">
        <span th:if="${keHoach.trangThai == 'DANG_MO'}" class="badge badge-success"
              style="font-size:13px;padding:6px 14px;">
          <i class="fa-solid fa-circle-dot"></i> Đang mở — Sinh viên có thể đăng ký
        </span>
        <span th:if="${keHoach.trangThai == 'DA_DONG'}" class="badge badge-secondary"
              style="font-size:13px;padding:6px 14px;">
          <i class="fa-solid fa-lock"></i> Đã đóng
        </span>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;">

        <!-- Danh sách môn trong kế hoạch -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">
              <i class="fa-solid fa-book" style="color:var(--primary);margin-right:6px;"></i>
              Môn học trong kế hoạch
              <span style="font-size:12px;color:var(--gray-500);margin-left:6px;"
                    th:text="'(' + ${keHoach.danhSachMon.size()} + ' môn)'"></span>
            </span>
          </div>
          <div class="card-body" style="padding:0;">
            <div th:if="${keHoach.danhSachMon.empty}" style="padding:20px;color:var(--gray-500);text-align:center;">
              Chưa có môn học nào. Thêm môn bên dưới.
            </div>
            <table th:if="${!keHoach.danhSachMon.empty}" class="table">
              <thead><tr><th>Mã môn</th><th>Tên môn</th><th>TC</th><th></th></tr></thead>
              <tbody>
                <tr th:each="m : ${keHoach.danhSachMon}">
                  <td><code th:text="${m.monHoc.maMon}"></code></td>
                  <td th:text="${m.monHoc.tenMon}"></td>
                  <td th:text="${m.monHoc.soTinChi}"></td>
                  <td>
                    <form th:action="@{/admin/nguyen-vong/{kId}/xoa-mon/{mId}(kId=${keHoach.id},mId=${m.id})}"
                          method="post" onsubmit="return confirm('Xóa môn này?')">
                      <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn btn-danger btn-sm">
                        <i class="fa-solid fa-trash"></i>
                      </button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <!-- Form thêm môn -->
          <div style="padding:14px;border-top:1px solid var(--gray-200);">
            <form th:action="@{/admin/nguyen-vong/{id}/them-mon(id=${keHoach.id})}" method="post">
              <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <div class="flex">
                <select name="monHocId" class="form-control" style="flex:1;" required>
                  <option value="">-- Thêm môn học vào kế hoạch --</option>
                  <option th:each="mh : ${tatCaMonHoc != null ? tatCaMonHoc : danhSachMonHoc}"
                          th:if="${monDaTrongKeHoach == null or !monDaTrongKeHoach.contains(mh.id)}"
                          th:value="${mh.id}"
                          th:text="${mh.maMon} + ' — ' + ${mh.tenMon}"></option>
                </select>
                <button type="submit" class="btn btn-primary">
                  <i class="fa-solid fa-plus"></i> Thêm
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Danh sách SV đã đăng ký -->
        <div class="card">
          <div class="card-header" style="display:flex;align-items:center;justify-content:space-between;">
            <span class="card-title">
              <i class="fa-solid fa-users" style="color:var(--success);margin-right:6px;"></i>
              Sinh viên đã đăng ký
              <span style="font-size:12px;color:var(--gray-500);margin-left:6px;"
                    th:text="'(' + ${danhSachDangKy.size()} + ' bản ghi)'"></span>
            </span>
            <!-- Nút duyệt tất cả -->
            <form th:action="@{/admin/nguyen-vong/{id}/duyet-tat-ca(id=${keHoach.id})}" method="post"
                  onsubmit="return confirm('Duyệt tất cả bản ghi đang CHỜ DUYỆT?')">
              <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-success btn-sm">
                <i class="fa-solid fa-check-double"></i> Duyệt tất cả
              </button>
            </form>
          </div>
          <div class="card-body" style="padding:0;">
            <div th:if="${danhSachDangKy.empty}" class="empty-state">
              <i class="fa-solid fa-inbox"></i>Chưa có sinh viên đăng ký.
            </div>
            <table th:if="${!danhSachDangKy.empty}" class="table">
              <thead>
                <tr>
                  <th>MSSV</th><th>Họ tên</th><th>Môn học</th>
                  <th>Ngày ĐK</th><th>Trạng thái</th><th>Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="dk : ${danhSachDangKy}">
                  <td th:text="${dk.sinhVien.mssv}"></td>
                  <td th:text="${dk.sinhVien.hoTen}"></td>
                  <td th:text="${dk.nguyenVongMonHoc.monHoc.tenMon}"></td>
                  <td th:text="${#temporals.format(dk.ngayDangKy,'dd/MM/yyyy')}"></td>
                  <td>
                    <span th:if="${dk.trangThai == 'CHO_DUYET'}"  class="badge badge-warning">Chờ duyệt</span>
                    <span th:if="${dk.trangThai == 'DA_DUYET'}"   class="badge badge-success">Đã duyệt</span>
                    <span th:if="${dk.trangThai == 'DA_HUY'}"     class="badge badge-danger">Đã hủy</span>
                  </td>
                  <td class="flex">
                    <!-- Nút Duyệt (chỉ hiện khi CHO_DUYET) -->
                    <form th:if="${dk.trangThai == 'CHO_DUYET'}"
                          th:action="@{/admin/nguyen-vong/{kId}/duyet/{dkId}(kId=${keHoach.id},dkId=${dk.id})}"
                          method="post">
                      <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn btn-success btn-sm" title="Duyệt">
                        <i class="fa-solid fa-check"></i>
                      </button>
                    </form>
                    <!-- Nút Từ chối (chỉ hiện khi CHO_DUYET hoặc DA_DUYET) -->
                    <form th:if="${dk.trangThai != 'DA_HUY'}"
                          th:action="@{/admin/nguyen-vong/{kId}/tu-choi/{dkId}(kId=${keHoach.id},dkId=${dk.id})}"
                          method="post"
                          onsubmit="return confirm('Từ chối nguyện vọng này?')">
                      <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn btn-danger btn-sm" title="Từ chối">
                        <i class="fa-solid fa-xmark"></i>
                      </button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
</body>
</html>
