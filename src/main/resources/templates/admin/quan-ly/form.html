<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Cán bộ Quản lý</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="layout">
  <div th:insert="~{fragments/sidebar :: admin('admin-ql')}"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title" th:text="${quanLy.id == null} ? 'Thêm cán bộ quản lý' : 'Sửa cán bộ quản lý'">Form</div>
    </header>
    <div class="content">
      <div th:if="${errorMsg}" class="flash flash-danger"><i class="fa-solid fa-circle-exclamation"></i><span th:text="${errorMsg}"></span></div>

      <div class="page-hd">
        <div class="page-hd-title" th:text="${quanLy.id == null} ? 'Thêm cán bộ quản lý' : 'Cập nhật cán bộ quản lý'">Form</div>
        <a th:href="@{/admin/quan-ly}" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
      </div>

      <div class="card" style="max-width:650px;">
        <div class="card-body">
          <form th:action="${quanLy.id == null} ? @{/admin/quan-ly/them} : @{/admin/quan-ly/sua/{id}(id=${quanLy.id})}" method="post">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group" style="margin-bottom:14px;">
              <label class="form-label">Họ và tên <span style="color:#ef4444;">*</span></label>
              <input type="text" name="hoTen" class="form-control" th:value="${quanLy.hoTen}" required placeholder="Ví dụ: Nguyễn Văn Quản Lý"/>
            </div>

            <div class="form-group" style="margin-bottom:14px;">
              <label class="form-label">Email đăng nhập <span style="color:#ef4444;">*</span></label>
              <input type="email" name="email" class="form-control" th:value="${quanLy.email}" required placeholder="Ví dụ: quanly@epu.edu.vn"/>
            </div>

            <div class="form-group" style="margin-bottom:14px;">
              <label class="form-label" th:text="${quanLy.id == null} ? 'Mật khẩu khởi tạo *' : 'Đặt lại mật khẩu mới (bỏ trống nếu giữ nguyên)'">Mật khẩu</label>
              <input type="password" name="matKhau" class="form-control" th:required="${quanLy.id == null}" placeholder="Nhập mật khẩu an toàn"/>
              <small style="color:#64748b;font-size:11.5px;display:block;margin-top:4px;">
                <i class="fa-solid fa-shield-halved" style="color:#16a34a;"></i>
                Mật khẩu được mã hóa một chiều BCrypt an toàn. Quản trị viên không thể xem mật khẩu gốc của cán bộ quản lý.
              </small>
            </div>

            <div class="grid-2" style="margin-bottom:18px;">
              <div class="form-group">
                <label class="form-label">Đơn vị / Phòng ban</label>
                <input type="text" name="donVi" class="form-control" th:value="${quanLy.donVi}" placeholder="Ví dụ: Phòng Đào Tạo"/>
              </div>
              <div class="form-group">
                <label class="form-label">Số điện thoại</label>
                <input type="text" name="soDienThoai" class="form-control" th:value="${quanLy.soDienThoai}" placeholder="09xxxxxxxx"/>
              </div>
            </div>

            <div style="display:flex;justify-content:flex-end;gap:10px;">
              <a th:href="@{/admin/quan-ly}" class="btn btn-outline">Hủy</a>
              <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Lưu thông tin</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
