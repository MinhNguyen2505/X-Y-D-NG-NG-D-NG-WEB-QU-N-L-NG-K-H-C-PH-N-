<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(
          pageTitle     = 'Quản lý Lớp học phần',
          activePage    = 'admin-lhp',
          content       = ~{::pageContent}
      )}">
<head><title>Quản lý Lớp học phần</title></head>
<body>

<th:block th:fragment="pageContent">
  <div class="greeting-banner" style="background: linear-gradient(135deg, #c2410c 0%, #7c2d12 100%); margin-bottom: 24px;">
    <div>
      <div class="greeting-name" style="font-size: 20px;">Quản lý Lớp học phần</div>
      <div class="greeting-date">Mở lớp và phân công giảng dạy</div>
    </div>
    <div class="greeting-icon">🗂️</div>
  </div>

  <div class="news-section">
    <div class="news-header">
      <div class="news-title">Danh sách lớp học phần</div>
      <a href="#" class="news-more" style="background:var(--primary); color:white; padding:6px 12px; border-radius:6px; text-decoration:none;">
        <i class="fa-solid fa-plus" style="margin-right:4px;"></i> Mở lớp mới
      </a>
    </div>
    
    <div style="padding: 16px;">
      <table style="width:100%; border-collapse: collapse; font-size:13px; text-align:left;">
        <thead>
          <tr style="background:var(--gray-50); border-bottom: 2px solid var(--gray-200);">
            <th style="padding:12px 16px; color:var(--gray-500);">Mã lớp</th>
            <th style="padding:12px 16px; color:var(--gray-500);">Môn học</th>
            <th style="padding:12px 16px; color:var(--gray-500);">Học kỳ</th>
            <th style="padding:12px 16px; color:var(--gray-500);">Giảng viên</th>
            <th style="padding:12px 16px; color:var(--gray-500);">Sĩ số</th>
            <th style="padding:12px 16px; color:var(--gray-500);">Trạng thái</th>
            <th style="padding:12px 16px; color:var(--gray-500); text-align:center;">Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="lhp : ${lopHocPhanList}" style="border-bottom: 1px solid var(--gray-100);">
            <td style="padding:12px 16px; font-weight:600; color:var(--navy);" th:text="${lhp.maLopHp}">LHP01</td>
            <td style="padding:12px 16px;" th:text="${lhp.monHoc.tenMon}">Toán cao cấp 1</td>
            <td style="padding:12px 16px;" th:text="${lhp.hocKy.tenHocKy}">HK1 2024</td>
            <td style="padding:12px 16px;" th:text="${lhp.giangVien.hoTen}">GV A</td>
            <td style="padding:12px 16px;" th:text="${lhp.siSoHienTai + '/' + lhp.siSoToiDa}">0/60</td>
            <td style="padding:12px 16px;">
              <span th:text="${lhp.trangThai}" style="padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight:600; background: #dcfce7; color: #15803d;">MỞ</span>
            </td>
            <td style="padding:12px 16px; text-align:center;">
              <a href="#" style="color:var(--primary); margin-right:12px;"><i class="fa-solid fa-pen-to-square"></i></a>
              <a href="#" style="color:var(--danger);"><i class="fa-solid fa-trash-can"></i></a>
            </td>
          </tr>
          <tr th:if="${lopHocPhanList == null or #lists.isEmpty(lopHocPhanList)}">
            <td colspan="7" style="padding:24px; text-align:center; color:var(--gray-400);">Chưa có dữ liệu lớp học phần.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</th:block>

</body>
</html>
