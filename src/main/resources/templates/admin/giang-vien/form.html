<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Form Giảng viên</title>
<link rel="stylesheet" th:href="@{/css/app.css}"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/></head>
<body><div class="layout">
  <div th:insert="~{fragments/sidebar :: admin('admin-gv')}"></div>
  <div class="main">
    <header class="topbar"><div class="topbar-title" th:text="${giangVien.id == null} ? 'Thêm giảng viên' : 'Sửa giảng viên'">Form</div></header>
    <div class="content">
      <div class="page-hd">
        <div class="page-hd-title" th:text="${giangVien.id == null} ? 'Thêm giảng viên' : 'Sửa giảng viên'">Form</div>
        <a th:href="@{/admin/giang-vien}" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
      </div>
      <div class="card" style="max-width:520px;"><div class="card-body">
        <form th:action="${giangVien.id == null} ? @{/admin/giang-vien/them} : @{/admin/giang-vien/sua/{id}(id=${giangVien.id})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="form-group"><label class="form-label">Mã GV *</label>
            <input type="text" name="maGv" class="form-control" th:value="${giangVien.maGv}" required/></div>
          <div class="form-group"><label class="form-label">Họ tên *</label>
            <input type="text" name="hoTen" class="form-control" th:value="${giangVien.hoTen}" required/></div>
          <div class="form-group"><label class="form-label">Email *</label>
            <input type="email" name="email" class="form-control" th:value="${giangVien.email}" required/></div>
          <div class="form-group">
            <label class="form-label" th:text="${giangVien.id == null} ? 'Mật khẩu khởi tạo *' : 'Đặt lại mật khẩu mới (bỏ trống = giữ nguyên)'">Mật khẩu</label>
            <input type="password" name="matKhau" class="form-control" th:required="${giangVien.id == null}" placeholder="Nhập mật khẩu an toàn"/>
            <small style="color:#64748b;font-size:11.5px;display:block;margin-top:4px;">
              <i class="fa-solid fa-shield-halved" style="color:#16a34a;"></i>
              Mật khẩu được mã hóa một chiều BCrypt. Admin không xem được mật khẩu gốc của giảng viên.
            </small>
          </div>
          <div class="form-group"><label class="form-label">Khoa/Bộ môn</label>
            <input type="text" name="khoaBoMon" class="form-control" th:value="${giangVien.khoaBoMon}"/></div>
          <div class="flex mt-2">
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Lưu</button>
            <a th:href="@{/admin/giang-vien}" class="btn btn-outline">Hủy</a>
          </div>
        </form>
      </div></div>
    </div>
  </div>
</div></body></html>
