<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Form Sinh viên</title>
<link rel="stylesheet" th:href="@{/css/app.css}"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/></head>
<body><div class="layout">
  <div th:insert="~{fragments/sidebar :: admin('admin-sv')}"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title" th:text="${sinhVien.id == null} ? 'Thêm sinh viên' : 'Sửa sinh viên'">Form</div>
    </header>
    <div class="content">
      <div th:if="${errorMsg}" class="flash flash-danger"><i class="fa-solid fa-circle-exclamation"></i><span th:text="${errorMsg}"></span></div>
      <div class="page-hd">
        <div class="page-hd-title" th:text="${sinhVien.id == null} ? 'Thêm sinh viên' : 'Sửa sinh viên'">Form</div>
        <a th:href="@{/admin/sinh-vien}" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
      </div>
      <div class="card" style="max-width:600px;">
        <div class="card-body">
          <form th:action="${sinhVien.id == null} ? @{/admin/sinh-vien/them} : @{/admin/sinh-vien/sua/{id}(id=${sinhVien.id})}" method="post">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="grid-2">
              <div class="form-group">
                <label class="form-label">MSSV *</label>
                <input type="text" name="mssv" class="form-control" th:value="${sinhVien.mssv}" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Họ tên *</label>
                <input type="text" name="hoTen" class="form-control" th:value="${sinhVien.hoTen}" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Email *</label>
                <input type="email" name="email" class="form-control" th:value="${sinhVien.email}" required/>
              </div>
              <div class="form-group">
                <label class="form-label" th:text="${sinhVien.id == null} ? 'Mật khẩu khởi tạo *' : 'Đặt lại mật khẩu mới (bỏ trống = giữ nguyên)'">Mật khẩu</label>
                <input type="password" name="matKhau" class="form-control"
                       th:required="${sinhVien.id == null}" placeholder="Nhập mật khẩu an toàn"/>
                <small style="color:#64748b;font-size:11.5px;display:block;margin-top:4px;">
                  <i class="fa-solid fa-shield-halved" style="color:#16a34a;"></i>
                  Mật khẩu được mã hóa một chiều BCrypt. Admin không xem được mật khẩu gốc của sinh viên.
                </small>
              </div>
              <div class="form-group">
                <label class="form-label">Ngày sinh</label>
                <input type="date" name="ngaySinh" class="form-control" th:value="${sinhVien.ngaySinh}"/>
              </div>
              <div class="form-group">
                <label class="form-label">Lớp sinh hoạt</label>
                <input type="text" name="lopSinhHoat" class="form-control" th:value="${sinhVien.lopSinhHoat}"/>
              </div>
              <div class="form-group">
                <label class="form-label">Khoá học</label>
                <input type="text" name="khoaHoc" class="form-control" th:value="${sinhVien.khoaHoc}"/>
              </div>
              <div class="form-group">
                <label class="form-label">Ngành</label>
                <select name="nganh.id" class="form-control">
                  <option value="">-- Chọn ngành --</option>
                  <option th:each="n : ${danhSachNganh}" th:value="${n.id}" th:text="${n.tenNganh}"
                          th:selected="${sinhVien.nganh?.id == n.id}"></option>
                </select>
              </div>
            </div>
            <div class="flex mt-2">
              <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Lưu</button>
              <a th:href="@{/admin/sinh-vien}" class="btn btn-outline">Hủy</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
