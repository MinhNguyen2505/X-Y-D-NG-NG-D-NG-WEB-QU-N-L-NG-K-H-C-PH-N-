<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Quản lý Sinh viên — Quản trị</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .privacy-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
  </style>
</head>
<body>
<div class="layout">
  <div th:insert="~{fragments/sidebar :: admin('admin-sv')}"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title">Quản lý Sinh viên</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="privacy-badge">
          <i class="fa-solid fa-shield-halved"></i> Mật khẩu mã hóa BCrypt
        </span>
      </div>
    </header>

    <div class="content">
      <div th:if="${successMsg}" class="flash flash-success">
        <i class="fa-solid fa-circle-check"></i><span th:text="${successMsg}"></span>
      </div>
      <div th:if="${errorMsg}" class="flash flash-danger">
        <i class="fa-solid fa-circle-exclamation"></i><span th:text="${errorMsg}"></span>
      </div>

      <div class="page-hd">
        <div>
          <div class="page-hd-title">Danh sách Sinh viên</div>
          <div class="page-hd-sub" th:text="${danhSach?.size()} + ' sinh viên trong hệ thống'"></div>
        </div>
        <div style="display:flex;gap:8px;">
          <button type="button" class="btn btn-outline" id="btnPrivacy" onclick="togglePrivacyMode()">
            <i class="fa-solid fa-eye-slash"></i> Che thông tin cá nhân
          </button>
          <a th:href="@{/admin/sinh-vien/them}" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> Thêm sinh viên
          </a>
        </div>
      </div>

      <div class="card">
        <div class="card-body" style="padding:0;">
          <table class="table">
            <thead>
              <tr>
                <th>MSSV</th>
                <th>Họ tên</th>
                <th>Email tài khoản</th>
                <th>Lớp</th>
                <th>Ngành</th>
                <th>Bảo mật MK</th>
                <th>Trạng thái</th>
                <th style="text-align:right;">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="sv : ${danhSach}">
                <td><strong th:text="${sv.mssv}"></strong></td>
                <td th:text="${sv.hoTen}"></td>
                <td>
                  <span class="masked-email" th:data-original="${sv.email}" th:text="${sv.email}"></span>
                </td>
                <td th:text="${sv.lopSinhHoat ?: '—'}"></td>
                <td th:text="${sv.nganh?.tenNganh ?: '—'}"></td>
                <td>
                  <span style="font-size:11px;color:#059669;font-weight:600;display:inline-flex;align-items:center;gap:4px;" title="Mật khẩu được mã hóa BCrypt 1 chiều">
                    <i class="fa-solid fa-lock"></i> Đã băm bảo mật
                  </span>
                </td>
                <td>
                  <span class="badge badge-success" th:text="${sv.trangThai}"></span>
                </td>
                <td style="text-align:right;">
                  <div class="flex" style="justify-content:flex-end;gap:5px;">
                    <!-- Nút Reset Mật Khẩu -->
                    <form th:action="@{/admin/sinh-vien/reset-mat-khau/{id}(id=${sv.id})}" method="post" style="margin:0"
                          onsubmit="return confirm('Đặt lại mật khẩu về mặc định [123456]?')">
                      <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn btn-outline btn-sm" title="Reset mật khẩu về 123456" style="color:#d97706;border-color:#fed7aa;">
                        <i class="fa-solid fa-rotate-left"></i> Reset MK
                      </button>
                    </form>
                    <!-- Nút Sửa -->
                    <a th:href="@{/admin/sinh-vien/sua/{id}(id=${sv.id})}" class="btn btn-outline btn-sm" title="Chỉnh sửa">
                      <i class="fa-solid fa-pen"></i>
                    </a>
                    <!-- Nút Xóa -->
                    <form th:action="@{/admin/sinh-vien/xoa/{id}(id=${sv.id})}" method="post" style="margin:0"
                          onsubmit="return confirm('Bạn có chắc chắn muốn xóa sinh viên này?')">
                      <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn btn-danger btn-sm" title="Xóa">
                        <i class="fa-solid fa-trash"></i>
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let privacyEnabled = false;

function maskEmail(email) {
  if (!email || !email.includes('@')) return email;
  const parts = email.split('@');
  const user = parts[0];
  const domain = parts[1];
  const maskedUser = user.length <= 2 ? user + '***' : user.substring(0, 2) + '***';
  return maskedUser + '@' + domain;
}

function togglePrivacyMode() {
  privacyEnabled = !privacyEnabled;
  const btn = document.getElementById('btnPrivacy');
  const elements = document.querySelectorAll('.masked-email');

  elements.forEach(el => {
    const original = el.getAttribute('data-original');
    if (privacyEnabled) {
      el.textContent = maskEmail(original);
    } else {
      el.textContent = original;
    }
  });

  if (privacyEnabled) {
    btn.innerHTML = '<i class="fa-solid fa-eye"></i> Hiện thông tin đầy đủ';
    btn.style.background = '#e0f2fe';
    btn.style.borderColor = '#7dd3fc';
  } else {
    btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i> Che thông tin cá nhân';
    btn.style.background = '';
    btn.style.borderColor = '';
  }
}
</script>
</body>
</html>
