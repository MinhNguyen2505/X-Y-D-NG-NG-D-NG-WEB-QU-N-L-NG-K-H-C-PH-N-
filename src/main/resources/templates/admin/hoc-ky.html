<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(
          pageTitle     = 'Quản lý Học kỳ',
          activePage    = 'admin-hk',
          content       = ~{::pageContent}
      )}">
<head><title>Quản lý Học kỳ</title></head>
<body>

<th:block th:fragment="pageContent">
  <div class="greeting-banner" style="background: linear-gradient(135deg, #8b5cf6 0%, #5b21b6 100%); margin-bottom: 24px;">
    <div>
      <div class="greeting-name" style="font-size: 20px;">Quản lý Học kỳ</div>
      <div class="greeting-date">Mở học kỳ mới và thiết lập thời gian đăng ký học phần</div>
    </div>
    <div class="greeting-icon">📆</div>
  </div>

  <div class="news-section">
    <div class="news-header">
      <div class="news-title">Danh sách Học kỳ</div>
      <a href="#" class="news-more" style="background:var(--primary); color:white; padding:6px 12px; border-radius:6px; text-decoration:none;">
        <i class="fa-solid fa-plus" style="margin-right:4px;"></i> Thêm học kỳ mới
      </a>
    </div>
    
    <div style="padding: 16px;">
      <table style="width:100%; border-collapse: collapse; font-size:13px; text-align:left;">
        <thead>
          <tr style="background:var(--gray-50); border-bottom: 2px solid var(--gray-200);">
            <th style="padding:12px 16px; color:var(--gray-500);">Tên học kỳ</th>
            <th style="padding:12px 16px; color:var(--gray-500);">Năm học</th>
            <th style="padding:12px 16px; color:var(--gray-500);">Bắt đầu ĐK</th>
            <th style="padding:12px 16px; color:var(--gray-500);">Kết thúc ĐK</th>
            <th style="padding:12px 16px; color:var(--gray-500);">Trạng thái</th>
            <th style="padding:12px 16px; color:var(--gray-500); text-align:center;">Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="hk : ${hocKyList}" style="border-bottom: 1px solid var(--gray-100);">
            <td style="padding:12px 16px; font-weight:600; color:var(--navy);" th:text="${hk.tenHocKy}">Học kỳ 1</td>
            <td style="padding:12px 16px;" th:text="${hk.namHoc}">2024-2025</td>
            <td style="padding:12px 16px;" th:text="${#temporals.format(hk.ngayBatDauDk, 'dd/MM/yyyy')}">01/08/2024</td>
            <td style="padding:12px 16px;" th:text="${#temporals.format(hk.ngayKetThucDk, 'dd/MM/yyyy')}">31/08/2024</td>
            <td style="padding:12px 16px;">
              <span style="padding:4px 8px; border-radius:4px; font-size:11px; font-weight:600; background:#dcfce7; color:#15803d;">MỞ</span>
            </td>
            <td style="padding:12px 16px; text-align:center;">
              <a href="#" style="color:var(--primary); margin-right:12px;"><i class="fa-solid fa-pen-to-square"></i></a>
            </td>
          </tr>
          <tr th:if="${hocKyList == null or #lists.isEmpty(hocKyList)}">
            <td colspan="6" style="padding:24px; text-align:center; color:var(--gray-400);">Chưa có dữ liệu học kỳ.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</th:block>

</body>
</html>
