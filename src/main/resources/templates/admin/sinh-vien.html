<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(
          pageTitle     = 'Quản lý Sinh viên',
          activePage    = 'admin-sv',
          content       = ~{::pageContent}
      )}">
<head><title>Quản lý Sinh viên</title></head>
<body>

<th:block th:fragment="pageContent">
  <div class="greeting-banner" style="background: linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%); margin-bottom: 24px;">
    <div>
      <div class="greeting-name" style="font-size: 20px;">Quản lý Sinh viên</div>
      <div class="greeting-date">Xem, thêm, sửa, xóa dữ liệu sinh viên toàn trường</div>
    </div>
    <div class="greeting-icon">🧑‍🎓</div>
  </div>

  <div class="news-section">
    <div class="news-header">
      <div class="news-title">Danh sách sinh viên</div>
      <a href="#" class="news-more" style="background:var(--primary); color:white; padding:6px 12px; border-radius:6px; text-decoration:none;">
        <i class="fa-solid fa-plus" style="margin-right:4px;"></i> Thêm sinh viên
      </a>
    </div>
    
    <div style="padding: 16px;">
      <table style="width:100%; border-collapse: collapse; font-size:13px; text-align:left;">
        <thead>
          <tr style="background:var(--gray-50); border-bottom: 2px solid var(--gray-200);">
            <th style="padding:12px 16px; color:var(--gray-500);">MSSV</th>
            <th style="padding:12px 16px; color:var(--gray-500);">Họ tên</th>
            <th style="padding:12px 16px; color:var(--gray-500);">Lớp SH</th>
            <th style="padding:12px 16px; color:var(--gray-500);">Ngành</th>
            <th style="padding:12px 16px; color:var(--gray-500);">Trạng thái</th>
            <th style="padding:12px 16px; color:var(--gray-500); text-align:center;">Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="sv : ${sinhVienList}" style="border-bottom: 1px solid var(--gray-100);">
            <td style="padding:12px 16px; font-weight:600; color:var(--navy);" th:text="${sv.mssv}">SV01</td>
            <td style="padding:12px 16px;" th:text="${sv.hoTen}">Nguyễn Văn A</td>
            <td style="padding:12px 16px;" th:text="${sv.lopSinhHoat}">CNTT1</td>
            <td style="padding:12px 16px;" th:text="${sv.nganh.tenNganh}">CNTT</td>
            <td style="padding:12px 16px;">
              <span th:text="${sv.trangThai}" style="padding:4px 8px; border-radius:4px; font-size:11px; font-weight:600; background:#dcfce7; color:#15803d;">ĐANG HỌC</span>
            </td>
            <td style="padding:12px 16px; text-align:center;">
              <a href="#" style="color:var(--primary); margin-right:12px;"><i class="fa-solid fa-pen-to-square"></i></a>
              <a href="#" style="color:var(--danger);"><i class="fa-solid fa-trash-can"></i></a>
            </td>
          </tr>
          <tr th:if="${sinhVienList == null or #lists.isEmpty(sinhVienList)}">
            <td colspan="6" style="padding:24px; text-align:center; color:var(--gray-400);">Không có dữ liệu sinh viên.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</th:block>

</body>
</html>
