<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(
          pageTitle     = 'Quản lý Giảng viên',
          activePage    = 'admin-gv',
          content       = ~{::pageContent}
      )}">
<head><title>Quản lý Giảng viên</title></head>
<body>

<th:block th:fragment="pageContent">
  <div class="greeting-banner" style="background: linear-gradient(135deg, #ea580c 0%, #9a3412 100%); margin-bottom: 24px;">
    <div>
      <div class="greeting-name" style="font-size: 20px;">Quản lý Giảng viên</div>
      <div class="greeting-date">Danh sách cán bộ giảng dạy</div>
    </div>
    <div class="greeting-icon">👨‍🏫</div>
  </div>

  <div class="news-section">
    <div class="news-header">
      <div class="news-title">Danh sách giảng viên</div>
      <a href="#" class="news-more" style="background:var(--primary); color:white; padding:6px 12px; border-radius:6px; text-decoration:none;">
        <i class="fa-solid fa-plus" style="margin-right:4px;"></i> Thêm giảng viên
      </a>
    </div>
    
    <div style="padding: 16px;">
      <table style="width:100%; border-collapse: collapse; font-size:13px; text-align:left;">
        <thead>
          <tr style="background:var(--gray-50); border-bottom: 2px solid var(--gray-200);">
            <th style="padding:12px 16px; color:var(--gray-500);">Mã GV</th>
            <th style="padding:12px 16px; color:var(--gray-500);">Họ tên</th>
            <th style="padding:12px 16px; color:var(--gray-500);">Email</th>
            <th style="padding:12px 16px; color:var(--gray-500);">Khoa/Bộ môn</th>
            <th style="padding:12px 16px; color:var(--gray-500); text-align:center;">Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="gv : ${giangVienList}" style="border-bottom: 1px solid var(--gray-100);">
            <td style="padding:12px 16px; font-weight:600; color:var(--navy);" th:text="${gv.maGv}">GV01</td>
            <td style="padding:12px 16px;" th:text="${gv.hoTen}">Nguyễn Văn B</td>
            <td style="padding:12px 16px;" th:text="${gv.email}">gv@email.com</td>
            <td style="padding:12px 16px;" th:text="${gv.khoaBoMon}">CNTT</td>
            <td style="padding:12px 16px; text-align:center;">
              <a href="#" style="color:var(--primary); margin-right:12px;"><i class="fa-solid fa-pen-to-square"></i></a>
              <a href="#" style="color:var(--danger);"><i class="fa-solid fa-trash-can"></i></a>
            </td>
          </tr>
          <tr th:if="${giangVienList == null or #lists.isEmpty(giangVienList)}">
            <td colspan="5" style="padding:24px; text-align:center; color:var(--gray-400);">Không có dữ liệu giảng viên.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</th:block>

</body>
</html>
