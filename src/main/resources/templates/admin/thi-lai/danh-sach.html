<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Đăng ký thi lại</title>
<link rel="stylesheet" th:href="@{/css/app.css}"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body><div class="layout">
  <div th:insert="~{fragments/sidebar :: admin('admin-thi-lai')}"></div>
  <div class="main">
    <header class="topbar"><div class="topbar-title">Quản lý Đăng ký thi lại</div></header>
    <div class="content">
      <div th:if="${successMsg}" class="flash flash-success"><i class="fa-solid fa-circle-check"></i><span th:text="${successMsg}"></span></div>
      <div th:if="${errorMsg}"   class="flash flash-danger"><i class="fa-solid fa-circle-exclamation"></i><span th:text="${errorMsg}"></span></div>

      <!-- Filter + Duyệt tất cả -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;">
        <div class="flex">
          <a th:href="@{/admin/thi-lai(trangThai='CHO_DUYET')}"
             th:class="${trangThaiFilter=='CHO_DUYET'} ? 'btn btn-primary' : 'btn btn-outline'">
            Chờ duyệt</a>
          <a th:href="@{/admin/thi-lai(trangThai='DA_DUYET')}"
             th:class="${trangThaiFilter=='DA_DUYET'} ? 'btn btn-success' : 'btn btn-outline'">
            Đã duyệt</a>
          <a th:href="@{/admin/thi-lai(trangThai='DA_HUY')}"
             th:class="${trangThaiFilter=='DA_HUY'} ? 'btn btn-danger' : 'btn btn-outline'">
            Đã hủy</a>
        </div>
        <form th:action="@{/admin/thi-lai/duyet-tat-ca}" method="post"
              onsubmit="return confirm('Duyệt tất cả đăng ký đang CHỜ DUYỆT?')">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-success">
            <i class="fa-solid fa-check-double"></i> Duyệt tất cả
          </button>
        </form>
      </div>

      <div class="card"><div class="card-body" style="padding:0;">
        <div th:if="${danhSach == null or danhSach.empty}" class="empty-state">
          <i class="fa-solid fa-rotate-right"></i>Không có bản ghi nào.
        </div>
        <table th:if="${danhSach != null and !danhSach.empty}" class="table">
          <thead>
            <tr>
              <th>STT</th><th>MSSV</th><th>Họ tên</th>
              <th>Môn học</th><th>Điểm</th><th>Ngày ĐK</th>
              <th>Trạng thái</th><th>Thao tác</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="dk, i : ${danhSach}">
              <td th:text="${i.count}"></td>
              <td th:text="${dk.sinhVien.mssv}"></td>
              <td th:text="${dk.sinhVien.hoTen}"></td>
              <td>
                <b th:text="${dk.dangKyHocPhan.lopHocPhan.monHoc.tenMon}"></b><br/>
                <small class="text-muted"
                       th:text="${dk.dangKyHocPhan.lopHocPhan.monHoc.maMon}
                                + ' — ' + ${dk.dangKyHocPhan.lopHocPhan.hocKy.tenHocKy}"></small>
              </td>
              <td style="text-align:center;font-weight:700;color:var(--danger);"
                  th:text="${dk.dangKyHocPhan.diemTongKet}"></td>
              <td th:text="${#temporals.format(dk.ngayDangKy,'dd/MM/yyyy HH:mm')}"></td>
              <td>
                <span th:if="${dk.trangThai == 'CHO_DUYET'}" class="badge badge-warning">Chờ duyệt</span>
                <span th:if="${dk.trangThai == 'DA_DUYET'}"  class="badge badge-success">Đã duyệt</span>
                <span th:if="${dk.trangThai == 'DA_HUY'}"    class="badge badge-danger">Đã hủy</span>
              </td>
              <td class="flex">
                <form th:if="${dk.trangThai == 'CHO_DUYET'}"
                      th:action="@{/admin/thi-lai/{id}/duyet(id=${dk.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-success btn-sm" title="Duyệt">
                    <i class="fa-solid fa-check"></i>
                  </button>
                </form>
                <form th:if="${dk.trangThai != 'DA_HUY'}"
                      th:action="@{/admin/thi-lai/{id}/tu-choi(id=${dk.id})}" method="post"
                      onsubmit="return confirm('Từ chối đăng ký thi lại này?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-danger btn-sm" title="Từ chối">
                    <i class="fa-solid fa-xmark"></i>
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div></div>
    </div>
  </div>
</div></body></html>
