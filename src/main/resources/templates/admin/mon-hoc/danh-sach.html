<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Môn học</title>
<link rel="stylesheet" th:href="@{/css/app.css}"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/></head>
<body><div class="layout">
  <div th:insert="~{fragments/sidebar :: admin('admin-mh')}"></div>
  <div class="main">
    <header class="topbar"><div class="topbar-title">Quản lý Môn học</div></header>
    <div class="content">
      <div th:if="${successMsg}" class="flash flash-success"><i class="fa-solid fa-circle-check"></i><span th:text="${successMsg}"></span></div>
      <div th:if="${errorMsg}"   class="flash flash-danger"><i class="fa-solid fa-circle-exclamation"></i><span th:text="${errorMsg}"></span></div>
      <div class="page-hd">
        <div><div class="page-hd-title">Môn học</div><div class="page-hd-sub" th:text="${danhSach?.size()} + ' môn'"></div></div>
        <a th:href="@{/admin/mon-hoc/them}" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Thêm</a>
      </div>
      <div class="card"><div class="card-body" style="padding:0;">
        <table class="table">
          <thead><tr><th>Mã môn</th><th>Tên môn học</th><th>TC</th><th>LT</th><th>TH</th><th></th></tr></thead>
          <tbody>
            <tr th:each="mh : ${danhSach}">
              <td><code th:text="${mh.maMon}"></code></td><td th:text="${mh.tenMon}"></td>
              <td th:text="${mh.soTinChi}"></td><td th:text="${mh.soTietLyThuyet}"></td>
              <td th:text="${mh.soTietThucHanh}"></td>
              <td class="flex">
                <a th:href="@{/admin/mon-hoc/sua/{id}(id=${mh.id})}" class="btn btn-outline btn-sm"><i class="fa-solid fa-pen"></i></a>
                <form th:action="@{/admin/mon-hoc/xoa/{id}(id=${mh.id})}" method="post" style="margin:0" onsubmit="return confirm('Xóa?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-danger btn-sm"><i class="fa-solid fa-trash"></i></button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div></div>
    </div>
  </div>
</div></body></html>
