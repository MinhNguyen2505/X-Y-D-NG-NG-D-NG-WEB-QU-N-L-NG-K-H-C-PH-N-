<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Form Môn học</title>
<link rel="stylesheet" th:href="@{/css/app.css}"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/></head>
<body><div class="layout">
  <div th:insert="~{fragments/sidebar :: admin('admin-mh')}"></div>
  <div class="main">
    <header class="topbar"><div class="topbar-title" th:text="${monHoc.id == null} ? 'Thêm môn học' : 'Sửa môn học'">Form</div></header>
    <div class="content">
      <div th:if="${successMsg}" class="flash flash-success"><i class="fa-solid fa-circle-check"></i><span th:text="${successMsg}"></span></div>
      <div th:if="${errorMsg}"   class="flash flash-danger"><i class="fa-solid fa-circle-exclamation"></i><span th:text="${errorMsg}"></span></div>
      <div class="page-hd">
        <div class="page-hd-title" th:text="${monHoc.id == null} ? 'Thêm môn học' : 'Sửa môn học'">Form</div>
        <a th:href="@{/admin/mon-hoc}" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;">
        <div class="card"><div class="card-body">
          <form th:action="${monHoc.id == null} ? @{/admin/mon-hoc/them} : @{/admin/mon-hoc/sua/{id}(id=${monHoc.id})}" method="post">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group"><label class="form-label">Mã môn *</label>
              <input type="text" name="maMon" class="form-control" th:value="${monHoc.maMon}" required/></div>
            <div class="form-group"><label class="form-label">Tên môn học *</label>
              <input type="text" name="tenMon" class="form-control" th:value="${monHoc.tenMon}" required/></div>
            <div class="grid-3">
              <div class="form-group"><label class="form-label">Tín chỉ *</label>
                <input type="number" name="soTinChi" class="form-control" th:value="${monHoc.soTinChi}" min="1" required/></div>
              <div class="form-group"><label class="form-label">Tiết LT</label>
                <input type="number" name="soTietLyThuyet" class="form-control" th:value="${monHoc.soTietLyThuyet}" min="0"/></div>
              <div class="form-group"><label class="form-label">Tiết TH</label>
                <input type="number" name="soTietThucHanh" class="form-control" th:value="${monHoc.soTietThucHanh}" min="0"/></div>
            </div>
            <div class="form-group"><label class="form-label">Mô tả</label>
              <textarea name="moTa" class="form-control" rows="3" th:text="${monHoc.moTa}"></textarea></div>
            <div class="flex mt-2">
              <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Lưu</button>
              <a th:href="@{/admin/mon-hoc}" class="btn btn-outline">Hủy</a>
            </div>
          </form>
        </div></div>

        <div th:if="${monHoc.id != null}" class="card"><div class="card-body">
          <div style="font-weight:700;color:var(--navy);margin-bottom:12px;">Môn tiên quyết</div>
          <div th:each="tq : ${danhSachTienQuyet}"
               style="padding:8px 10px;background:var(--gray-50);border-radius:6px;margin-bottom:8px;font-size:13px;"
               th:text="${tq.monTienQuyet.maMon} + ' — ' + ${tq.monTienQuyet.tenMon}"></div>
          <div th:if="${danhSachTienQuyet == null or danhSachTienQuyet.empty}"
               class="text-muted" style="margin-bottom:12px;font-size:13px;">Chưa có môn tiên quyết.</div>
          <form th:action="@{/admin/mon-hoc/{id}/tien-quyet(id=${monHoc.id})}" method="post">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="flex">
              <select name="monTienQuyetId" class="form-control" style="flex:1;">
                <option value="">-- Chọn môn --</option>
                <option th:each="mh : ${tatCaMonHoc}" th:if="${mh.id != monHoc.id}"
                        th:value="${mh.id}" th:text="${mh.maMon} + ' — ' + ${mh.tenMon}"></option>
              </select>
              <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Thêm</button>
            </div>
          </form>
        </div></div>
      </div>
    </div>
  </div>
</div></body></html>
