<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Học kỳ</title>
<link rel="stylesheet" th:href="@{/css/app.css}"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/></head>
<body><div class="layout">
  <div th:insert="~{fragments/sidebar :: admin('admin-hk')}"></div>
  <div class="main">
    <header class="topbar"><div class="topbar-title">Quản lý Học kỳ</div></header>
    <div class="content">
      <div th:if="${successMsg}" class="flash flash-success"><i class="fa-solid fa-circle-check"></i><span th:text="${successMsg}"></span></div>
      <div th:if="${errorMsg}"   class="flash flash-danger"><i class="fa-solid fa-circle-exclamation"></i><span th:text="${errorMsg}"></span></div>
      <div class="page-hd">
        <div class="page-hd-title">Học kỳ</div>
        <a th:href="@{/admin/hoc-ky/them}" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Tạo học kỳ</a>
      </div>
      <div class="card"><div class="card-body" style="padding:0;">
        <table class="table">
          <thead>
            <tr>
              <th>Tên học kỳ</th>
              <th>Năm học</th>
              <th>Bắt đầu ĐK</th>
              <th>Kết thúc ĐK</th>
              <th style="text-align:center;">TC min</th>
              <th style="text-align:center;">TC max</th>
              <th style="text-align:center;">Trạng thái ĐK</th>
              <th style="text-align:right;">Thao tác</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${danhSach == null or danhSach.empty}">
              <td colspan="8" style="text-align:center;color:var(--gray-500);padding:30px;">
                Chưa có dữ liệu học kỳ nào. Nhấn "Tạo học kỳ" để thêm mới.
              </td>
            </tr>
            <tr th:each="hk : ${danhSach}">
              <td><b th:text="${hk.tenHocKy}"></b></td>
              <td th:text="${hk.namHoc}"></td>
              <td th:text="${hk.ngayBatDauDk}"></td>
              <td th:text="${hk.ngayKetThucDk}"></td>
              <td style="text-align:center;" th:text="${hk.tinChiToiThieu != null ? hk.tinChiToiThieu : 0}"></td>
              <td style="text-align:center;" th:text="${hk.tinChiToiDa != null ? hk.tinChiToiDa : 0}"></td>
              <td style="text-align:center;">
                <span th:if="${hk.daChotDangKy == true}" class="badge badge-danger">
                  <i class="fa-solid fa-lock"></i> Đã chốt
                </span>
                <span th:unless="${hk.daChotDangKy == true}" class="badge badge-success">
                  <i class="fa-solid fa-lock-open"></i> Đang mở
                </span>
              </td>
              <td style="text-align:right;">
                <div style="display:inline-flex;gap:6px;">
                  <form th:if="${hk.daChotDangKy != true}" th:action="@{/admin/hoc-ky/{id}/chot-dang-ky(id=${hk.id})}" method="post" onsubmit="return confirm('Chốt đợt đăng ký của học kỳ này? Sinh viên sẽ không thể đăng ký hay hủy môn nữa.')">
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-warning btn-sm">
                      <i class="fa-solid fa-lock"></i> Chốt ĐK
                    </button>
                  </form>
                  <form th:if="${hk.daChotDangKy == true}" th:action="@{/admin/hoc-ky/{id}/mo-lai-dang-ky(id=${hk.id})}" method="post" onsubmit="return confirm('Mở lại đợt đăng ký cho học kỳ này?')">
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-success btn-sm">
                      <i class="fa-solid fa-lock-open"></i> Mở lại
                    </button>
                  </form>
                  <a th:href="@{/admin/hoc-ky/sua/{id}(id=${hk.id})}" class="btn btn-outline btn-sm">
                    <i class="fa-solid fa-pen"></i> Sửa
                  </a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div></div>
    </div>
  </div>
</div></body></html>
