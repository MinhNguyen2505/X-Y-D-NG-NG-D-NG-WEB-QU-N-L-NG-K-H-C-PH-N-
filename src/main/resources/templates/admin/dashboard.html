<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Dashboard Admin</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="layout">
  <div th:insert="~{fragments/sidebar :: admin('admin-home')}"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title">Tổng quan hệ thống</div>
      <div class="topbar-user">
        <div class="topbar-avatar" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">A</div>
        <span class="topbar-name" th:text="${#authentication.name}">Admin</span>
      </div>
    </header>
    <div class="content">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;">
        <div class="stat-card">
          <div class="stat-icon si-blue"><i class="fa-solid fa-user-graduate" style="color:#1d4ed8;"></i></div>
          <div><div class="stat-label">Sinh viên</div><div class="stat-val" th:text="${tongSinhVien}">0</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon si-purple"><i class="fa-solid fa-chalkboard-user" style="color:#6d28d9;"></i></div>
          <div><div class="stat-label">Giảng viên</div><div class="stat-val" th:text="${tongGiangVien}">0</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon si-orange"><i class="fa-solid fa-book" style="color:#c2410c;"></i></div>
          <div><div class="stat-label">Môn học</div><div class="stat-val" th:text="${tongMonHoc}">0</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon si-green"><i class="fa-solid fa-calendar" style="color:#15803d;"></i></div>
          <div><div class="stat-label">Học kỳ</div><div class="stat-val" th:text="${danhSachHocKy?.size() ?: 0}">0</div></div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
        <a th:href="@{/admin/sinh-vien}"    class="card" style="text-decoration:none;cursor:pointer;">
          <div class="card-body" style="text-align:center;padding:24px;">
            <div style="font-size:36px;margin-bottom:10px;">👩‍🎓</div>
            <div style="font-weight:700;color:var(--navy);">Quản lý Sinh viên</div>
          </div>
        </a>
        <a th:href="@{/admin/giang-vien}"   class="card" style="text-decoration:none;cursor:pointer;">
          <div class="card-body" style="text-align:center;padding:24px;">
            <div style="font-size:36px;margin-bottom:10px;">👨‍🏫</div>
            <div style="font-weight:700;color:var(--navy);">Quản lý Giảng viên</div>
          </div>
        </a>
        <a th:href="@{/admin/mon-hoc}"      class="card" style="text-decoration:none;cursor:pointer;">
          <div class="card-body" style="text-align:center;padding:24px;">
            <div style="font-size:36px;margin-bottom:10px;">📚</div>
            <div style="font-weight:700;color:var(--navy);">Quản lý Môn học</div>
          </div>
        </a>
        <a th:href="@{/admin/hoc-ky}"       class="card" style="text-decoration:none;cursor:pointer;">
          <div class="card-body" style="text-align:center;padding:24px;">
            <div style="font-size:36px;margin-bottom:10px;">📅</div>
            <div style="font-weight:700;color:var(--navy);">Quản lý Học kỳ</div>
          </div>
        </a>
        <a th:href="@{/admin/lop-hoc-phan}" class="card" style="text-decoration:none;cursor:pointer;">
          <div class="card-body" style="text-align:center;padding:24px;">
            <div style="font-size:36px;margin-bottom:10px;">🏫</div>
            <div style="font-weight:700;color:var(--navy);">Quản lý Lớp học phần</div>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
