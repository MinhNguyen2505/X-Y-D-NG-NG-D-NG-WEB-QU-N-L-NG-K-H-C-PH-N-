<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Dashboard Admin</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="layout">
  <div th:insert="~{fragments/sidebar :: admin('admin-home')}"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title">Tổng quan hệ thống</div>
      <div class="topbar-user">
        <div class="topbar-avatar" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">A</div>
        <span class="topbar-name" th:text="${#authentication.name}">Admin</span>
      </div>
    </header>
    <div class="content">

      <!-- Row 1: thống kê cơ bản -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px;">
        <div class="stat-card">
          <div class="stat-icon si-blue"><i class="fa-solid fa-user-graduate" style="color:#1d4ed8;"></i></div>
          <div><div class="stat-label">Sinh viên</div><div class="stat-val" th:text="${tongSinhVien}">0</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon si-purple"><i class="fa-solid fa-chalkboard-user" style="color:#6d28d9;"></i></div>
          <div><div class="stat-label">Giảng viên</div><div class="stat-val" th:text="${tongGiangVien}">0</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon si-orange"><i class="fa-solid fa-book" style="color:#c2410c;"></i></div>
          <div><div class="stat-label">Môn học</div><div class="stat-val" th:text="${tongMonHoc}">0</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon si-green"><i class="fa-solid fa-calendar" style="color:#15803d;"></i></div>
          <div><div class="stat-label">Học kỳ</div><div class="stat-val" th:text="${danhSachHocKy?.size() ?: 0}">0</div></div>
        </div>
      </div>

      <!-- Row 2: thống kê hoạt động -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px;">
        <div class="stat-card" th:style="${lopDangMo > 0} ? 'border-left:3px solid #15803d;' : ''">
          <div class="stat-icon si-green"><i class="fa-solid fa-layer-group" style="color:#15803d;"></i></div>
          <div>
            <div class="stat-label">Lớp đang mở</div>
            <div class="stat-val" th:text="${lopDangMo}" style="color:#15803d;">0</div>
          </div>
          <a th:href="@{/admin/lop-hoc-phan}" style="font-size:11px;color:#15803d;text-decoration:none;margin-left:auto;">Quản lý →</a>
        </div>
        <div class="stat-card" th:style="${nguyenVongChoDuyet > 0} ? 'border-left:3px solid #f59e0b;' : ''">
          <div class="stat-icon" style="background:#fef3c7;">
            <i class="fa-solid fa-star" style="color:#d97706;"></i>
          </div>
          <div>
            <div class="stat-label">Nguyện vọng chờ duyệt</div>
            <div class="stat-val" th:text="${nguyenVongChoDuyet}"
                 th:style="${nguyenVongChoDuyet > 0} ? 'color:#d97706;' : ''">0</div>
          </div>
          <a th:if="${nguyenVongChoDuyet > 0}"
             th:href="@{/admin/nguyen-vong}"
             style="font-size:11px;color:#d97706;text-decoration:none;margin-left:auto;">Duyệt →</a>
        </div>
        <div class="stat-card" th:style="${thiLaiChoDuyet > 0} ? 'border-left:3px solid #ef4444;' : ''">
          <div class="stat-icon" style="background:#fee2e2;">
            <i class="fa-solid fa-rotate-right" style="color:#dc2626;"></i>
          </div>
          <div>
            <div class="stat-label">Thi lại chờ duyệt</div>
            <div class="stat-val" th:text="${thiLaiChoDuyet}"
                 th:style="${thiLaiChoDuyet > 0} ? 'color:#dc2626;' : ''">0</div>
          </div>
          <a th:if="${thiLaiChoDuyet > 0}"
             th:href="@{/admin/thi-lai}"
             style="font-size:11px;color:#dc2626;text-decoration:none;margin-left:auto;">Duyệt →</a>
        </div>
      </div>

      <!-- Quick-links -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
        <a th:href="@{/admin/sinh-vien}"    class="card" style="text-decoration:none;cursor:pointer;">
          <div class="card-body" style="text-align:center;padding:24px;">
            <div style="font-size:36px;margin-bottom:10px;">👩‍🎓</div>
            <div style="font-weight:700;color:var(--navy);">Quản lý Sinh viên</div>
          </div>
        </a>
        <a th:href="@{/admin/giang-vien}"   class="card" style="text-decoration:none;cursor:pointer;">
          <div class="card-body" style="text-align:center;padding:24px;">
            <div style="font-size:36px;margin-bottom:10px;">👨‍🏫</div>
            <div style="font-weight:700;color:var(--navy);">Quản lý Giảng viên</div>
          </div>
        </a>
        <a th:href="@{/admin/mon-hoc}"      class="card" style="text-decoration:none;cursor:pointer;">
          <div class="card-body" style="text-align:center;padding:24px;">
            <div style="font-size:36px;margin-bottom:10px;">📚</div>
            <div style="font-weight:700;color:var(--navy);">Quản lý Môn học</div>
          </div>
        </a>
        <a th:href="@{/admin/hoc-ky}"       class="card" style="text-decoration:none;cursor:pointer;">
          <div class="card-body" style="text-align:center;padding:24px;">
            <div style="font-size:36px;margin-bottom:10px;">📅</div>
            <div style="font-weight:700;color:var(--navy);">Quản lý Học kỳ</div>
          </div>
        </a>
        <a th:href="@{/admin/lop-hoc-phan}" class="card" style="text-decoration:none;cursor:pointer;">
          <div class="card-body" style="text-align:center;padding:24px;">
            <div style="font-size:36px;margin-bottom:10px;">🏫</div>
            <div style="font-weight:700;color:var(--navy);">Quản lý Lớp học phần</div>
          </div>
        </a>
        <a th:href="@{/admin/nguyen-vong}"  class="card" style="text-decoration:none;cursor:pointer;">
          <div class="card-body" style="text-align:center;padding:24px;">
            <div style="font-size:36px;margin-bottom:10px;">⭐</div>
            <div style="font-weight:700;color:var(--navy);">Quản lý Nguyện vọng</div>
          </div>
        </a>
      </div>

    </div>
  </div>
</div>
</body>
</html>
