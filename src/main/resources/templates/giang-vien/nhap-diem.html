<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Nhập điểm</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="layout">
  <div th:insert="~{fragments/sidebar :: gv('gv-lop')}"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title">Nhập điểm — <span th:text="${lopHocPhan?.maLopHp}"></span></div>
      <div class="topbar-user">
        <div class="topbar-avatar" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">G</div>
        <span class="topbar-name" th:text="${giangVien?.hoTen ?: #authentication.name}">GV</span>
      </div>
    </header>
    <div class="content">
      <div th:if="${successMsg}" class="flash flash-success"><i class="fa-solid fa-circle-check"></i><span th:text="${successMsg}"></span></div>
      <div th:if="${errorMsg}"   class="flash flash-danger"><i class="fa-solid fa-circle-exclamation"></i><span th:text="${errorMsg}"></span></div>

      <div class="page-hd">
        <div>
          <div class="page-hd-title" th:text="${lopHocPhan?.monHoc?.tenMon}">Môn học</div>
          <div class="page-hd-sub" th:text="'Lớp: ' + ${lopHocPhan?.maLopHp} + ' | ' + ${danhSachSV?.size()} + ' sinh viên'"></div>
        </div>
        <a th:href="@{/giang-vien/danh-sach-lop}" class="btn btn-outline">
          <i class="fa-solid fa-arrow-left"></i> Quay lại
        </a>
      </div>

      <div class="card">
        <div class="card-header"><span class="card-title">Danh sách sinh viên</span></div>
        <div class="card-body" style="padding:0;">
          <div th:if="${danhSachSV == null or danhSachSV.empty}" class="empty-state">
            <i class="fa-solid fa-users"></i>Chưa có sinh viên đăng ký lớp này.
          </div>
          <table th:if="${danhSachSV != null and !danhSachSV.empty}" class="table">
            <thead><tr><th>MSSV</th><th>Họ tên</th><th>Điểm GK</th><th>Điểm CK</th><th>Điểm TK</th><th></th></tr></thead>
            <tbody>
              <tr th:each="dk : ${danhSachSV}">
                <form th:action="@{/giang-vien/nhap-diem/{id}(id=${lopHocPhan.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <input type="hidden" name="dangKyId" th:value="${dk.id}"/>
                  <td th:text="${dk.sinhVien.mssv}"></td>
                  <td th:text="${dk.sinhVien.hoTen}"></td>
                  <td>
                    <input type="number" name="diemGiuaKy" step="0.1" min="0" max="10"
                           th:value="${dk.diemGiuaKy}" placeholder="0.0"
                           style="width:75px;" class="form-control"/>
                  </td>
                  <td>
                    <input type="number" name="diemCuoiKy" step="0.1" min="0" max="10"
                           th:value="${dk.diemCuoiKy}" placeholder="0.0"
                           style="width:75px;" class="form-control"/>
                  </td>
                  <td>
                    <input type="number" name="diemTongKet" step="0.1" min="0" max="10"
                           th:value="${dk.diemTongKet}" placeholder="0.0"
                           style="width:75px;" class="form-control"/>
                  </td>
                  <td>
                    <button type="submit" class="btn btn-success btn-sm">
                      <i class="fa-solid fa-floppy-disk"></i> Lưu
                    </button>
                  </td>
                </form>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
