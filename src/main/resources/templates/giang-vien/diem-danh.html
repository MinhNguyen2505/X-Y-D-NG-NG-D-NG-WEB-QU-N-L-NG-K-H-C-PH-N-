<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Điểm danh</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .dd-group { display:flex; gap:8px; }
    .dd-label {
      cursor:pointer; font-size:12px; padding:3px 10px; border-radius:20px;
      border:1px solid var(--gray-300); user-select:none;
    }
    input[type="radio"].dd-radio { display:none; }
    input[type="radio"].dd-radio:checked + .dd-label-co-mat   { background:#dcfce7; color:#16a34a; border-color:#16a34a; font-weight:700; }
    input[type="radio"].dd-radio:checked + .dd-label-vang-phep{ background:#fef3c7; color:#92400e; border-color:#d97706; font-weight:700; }
    input[type="radio"].dd-radio:checked + .dd-label-vang-khong{ background:#fee2e2; color:#dc2626; border-color:#dc2626; font-weight:700; }
    .dd-label:hover { background:var(--gray-100); }
  </style>
</head>
<body>
<div class="layout">
  <div th:insert="~{fragments/sidebar :: gv('gv-lop')}"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title">Điểm danh — <span th:text="${lopHocPhan.maLopHp}"></span></div>
      <div class="topbar-user">
        <div class="topbar-avatar" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">G</div>
        <span class="topbar-name" th:text="${giangVien?.hoTen ?: #authentication.name}">GV</span>
      </div>
    </header>
    <div class="content">

      <div th:if="${successMsg}" class="flash flash-success">
        <i class="fa-solid fa-circle-check"></i><span th:text="${successMsg}"></span>
      </div>
      <div th:if="${errorMsg}" class="flash flash-danger">
        <i class="fa-solid fa-circle-exclamation"></i><span th:text="${errorMsg}"></span>
      </div>

      <div class="page-hd">
        <div>
          <div class="page-hd-title" th:text="${lopHocPhan.monHoc.tenMon}"></div>
          <div class="page-hd-sub"
               th:text="'Lớp: ' + ${lopHocPhan.maLopHp} + ' | ' + ${danhSachSV?.size() ?: 0} + ' sinh viên'"></div>
        </div>
        <a th:href="@{/giang-vien/lop/{id}(id=${lopHocPhan.id})}" class="btn btn-outline">
          <i class="fa-solid fa-arrow-left"></i> Quay lại
        </a>
      </div>

      <!-- Form chọn buổi -->
      <div class="card" style="margin-bottom:14px;">
        <div class="card-header">
          <span class="card-title">
            <i class="fa-solid fa-calendar-day" style="color:var(--primary);margin-right:6px;"></i>
            Chọn buổi điểm danh
          </span>
        </div>
        <div class="card-body">
          <form th:action="@{/giang-vien/diem-danh/{id}(id=${lopHocPhan.id})}"
                method="get"
                style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
            <div class="form-group" style="margin:0;">
              <label class="form-label">Ngày học *</label>
              <input type="date" name="ngayHoc" class="form-control"
                     th:value="${ngayChon}"
                     required style="width:180px;"/>
            </div>
            <div class="form-group" style="margin:0;">
              <label class="form-label">Tiết bắt đầu</label>
              <input type="number" name="tietBatDau" class="form-control"
                     th:value="${tietBatDau}" min="1" max="15"
                     style="width:80px;"/>
            </div>
            <div class="form-group" style="margin:0;">
              <label class="form-label">Tiết kết thúc</label>
              <input type="number" name="tietKetThuc" class="form-control"
                     th:value="${tietKetThuc}" min="1" max="15"
                     style="width:80px;"/>
            </div>
            <button type="submit" class="btn btn-primary">
              <i class="fa-solid fa-magnifying-glass"></i> Xem / Tải điểm danh
            </button>
          </form>
        </div>
      </div>

      <!-- Bảng điểm danh -->
      <div th:if="${ngayChon != null}">
        <form th:action="@{/giang-vien/diem-danh/{id}(id=${lopHocPhan.id})}" method="post">
          <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="ngayHoc"      th:value="${ngayChon}"/>
          <input type="hidden" name="tietBatDau"   th:value="${tietBatDau}"/>
          <input type="hidden" name="tietKetThuc"  th:value="${tietKetThuc}"/>

          <div class="card">
            <div class="card-header">
              <span class="card-title">
                <i class="fa-solid fa-clipboard-list" style="color:var(--primary);margin-right:6px;"></i>
                Điểm danh ngày
                <b th:text="${#temporals.format(ngayChon,'dd/MM/yyyy')}"></b>
                — Tiết <span th:text="${tietBatDau}"></span>–<span th:text="${tietKetThuc}"></span>
              </span>
              <button type="submit" class="btn btn-success">
                <i class="fa-solid fa-floppy-disk"></i> Lưu điểm danh
              </button>
            </div>
            <div class="card-body" style="padding:0;">

              <!-- Chọn tất cả nhanh -->
              <div style="padding:10px 16px;background:var(--gray-50);border-bottom:1px solid var(--gray-100);
                          display:flex;gap:12px;align-items:center;font-size:13px;">
                <span style="font-weight:600;">Chọn nhanh tất cả:</span>
                <button type="button" class="btn btn-outline btn-sm"
                        onclick="setAll('CO_MAT')">
                  <i class="fa-solid fa-check" style="color:#16a34a;"></i> Có mặt tất cả
                </button>
                <button type="button" class="btn btn-outline btn-sm"
                        onclick="setAll('VANG_CO_PHEP')">
                  <i class="fa-solid fa-clock" style="color:#d97706;"></i> Vắng có phép tất cả
                </button>
                <button type="button" class="btn btn-outline btn-sm"
                        onclick="setAll('VANG_KHONG_PHEP')">
                  <i class="fa-solid fa-xmark" style="color:#dc2626;"></i> Vắng không phép tất cả
                </button>
              </div>

              <div th:if="${danhSachSV == null or danhSachSV.empty}" class="empty-state">
                <i class="fa-solid fa-users"></i>Chưa có sinh viên đăng ký lớp này.
              </div>

              <table th:if="${danhSachSV != null and !danhSachSV.empty}" class="table">
                <thead>
                  <tr>
                    <th style="width:40px;text-align:center;">STT</th>
                    <th>MSSV</th>
                    <th>Họ và tên</th>
                    <th>Trạng thái điểm danh</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="dk, i : ${danhSachSV}"
                      th:with="dd=${diemDanhMap != null ? diemDanhMap[dk.id] : null}">
                    <td style="text-align:center;color:var(--gray-400);" th:text="${i.count}"></td>
                    <td><code th:text="${dk.sinhVien.mssv}"></code></td>
                    <td th:text="${dk.sinhVien.hoTen}"></td>
                    <td>
                      <!-- Radio group: CO_MAT / VANG_CO_PHEP / VANG_KHONG_PHEP -->
                      <div class="dd-group">

                        <input type="radio" class="dd-radio"
                               th:id="'co-mat-' + ${dk.id}"
                               th:name="'dd_' + ${dk.id}"
                               value="CO_MAT"
                               th:checked="${dd == null or dd.trangThai == 'CO_MAT'}"/>
                        <label th:for="'co-mat-' + ${dk.id}"
                               class="dd-label dd-label-co-mat">
                          <i class="fa-solid fa-check"></i> Có mặt
                        </label>

                        <input type="radio" class="dd-radio"
                               th:id="'vang-phep-' + ${dk.id}"
                               th:name="'dd_' + ${dk.id}"
                               value="VANG_CO_PHEP"
                               th:checked="${dd != null and dd.trangThai == 'VANG_CO_PHEP'}"/>
                        <label th:for="'vang-phep-' + ${dk.id}"
                               class="dd-label dd-label-vang-phep">
                          <i class="fa-solid fa-clock"></i> Vắng có phép
                        </label>

                        <input type="radio" class="dd-radio"
                               th:id="'vang-khong-' + ${dk.id}"
                               th:name="'dd_' + ${dk.id}"
                               value="VANG_KHONG_PHEP"
                               th:checked="${dd != null and dd.trangThai == 'VANG_KHONG_PHEP'}"/>
                        <label th:for="'vang-khong-' + ${dk.id}"
                               class="dd-label dd-label-vang-khong">
                          <i class="fa-solid fa-xmark"></i> Vắng không phép
                        </label>

                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>

              <!-- Nút lưu dưới bảng -->
              <div th:if="${danhSachSV != null and !danhSachSV.empty}"
                   style="padding:12px 16px;text-align:right;border-top:1px solid var(--gray-100);">
                <button type="submit" class="btn btn-success">
                  <i class="fa-solid fa-floppy-disk"></i> Lưu điểm danh
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- Chưa chọn ngày -->
      <div th:if="${ngayChon == null}" class="empty-state" style="min-height:160px;">
        <i class="fa-solid fa-hand-pointer"></i>
        Chọn ngày học ở trên để bắt đầu điểm danh.
      </div>

    </div>
  </div>
</div>

<script>
  function setAll(value) {
    document.querySelectorAll('input[type="radio"][value="' + value + '"]')
      .forEach(r => r.checked = true);
  }
</script>
</body>
</html>
