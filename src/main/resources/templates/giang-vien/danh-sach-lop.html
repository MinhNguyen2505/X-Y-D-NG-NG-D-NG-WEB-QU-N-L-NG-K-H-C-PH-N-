<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Danh sách lớp</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="layout">
  <div th:insert="~{fragments/sidebar :: gv('gv-lop')}"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title">Danh sách lớp phụ trách</div>
      <div class="topbar-user">
        <div class="topbar-avatar" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">G</div>
        <span class="topbar-name" th:text="${giangVien?.hoTen ?: #authentication.name}">GV</span>
      </div>
    </header>
    <div class="content">
      <div th:if="${successMsg}" class="flash flash-success"><i class="fa-solid fa-circle-check"></i><span th:text="${successMsg}"></span></div>
      <div th:if="${errorMsg}"   class="flash flash-danger"><i class="fa-solid fa-circle-exclamation"></i><span th:text="${errorMsg}"></span></div>

      <div class="card">
        <div class="card-header"><span class="card-title">Chọn học kỳ</span></div>
        <div class="card-body">
          <div class="flex-wrap">
            <a th:each="hk : ${danhSachHocKy}"
               th:href="@{/giang-vien/danh-sach-lop(hocKyId=${hk.id})}"
               th:text="${hk.tenHocKy} + ' (' + ${hk.namHoc} + ')'"
               th:class="${hocKyChon?.id == hk.id} ? 'btn btn-primary' : 'btn btn-outline'"></a>
          </div>
        </div>
      </div>

      <div th:if="${hocKyChon != null}" class="card">
        <div class="card-header">
          <span class="card-title">Lớp của tôi — <span th:text="${hocKyChon.tenHocKy}"></span></span>
        </div>
        <div class="card-body" style="padding:0;">
          <div th:if="${danhSachLop == null or danhSachLop.empty}" class="empty-state">
            <i class="fa-solid fa-chalkboard"></i>Bạn không phụ trách lớp nào trong học kỳ này.
          </div>
          <table th:if="${danhSachLop != null and !danhSachLop.empty}" class="table">
            <thead><tr><th>Mã lớp</th><th>Môn học</th><th>TC</th><th>Sĩ số</th><th>Trạng thái</th><th></th></tr></thead>
            <tbody>
              <tr th:each="lhp : ${danhSachLop}">
                <td><code th:text="${lhp.maLopHp}"></code></td>
                <td th:text="${lhp.monHoc.tenMon}"></td>
                <td th:text="${lhp.monHoc.soTinChi}"></td>
                <td th:text="${lhp.siSoHienTai} + '/' + ${lhp.siSoToiDa}"></td>
                <td>
                  <span class="badge" th:classappend="${lhp.trangThai.name()=='MO'}?' badge-success':' badge-secondary'"
                        th:text="${lhp.trangThai}"></span>
                </td>
                <td>
                  <a th:href="@{/giang-vien/nhap-diem/{id}(id=${lhp.id})}" class="btn btn-primary btn-sm">
                    <i class="fa-solid fa-pen"></i> Nhập điểm
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
