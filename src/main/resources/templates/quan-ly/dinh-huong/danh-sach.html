<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Định hướng học tập</title>
<link rel="stylesheet" th:href="@{/css/app.css}"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body><div class="layout">
  <div th:insert="~{fragments/sidebar :: ql('ql-dh')}"></div>
  <div class="main">
    <header class="topbar"><div class="topbar-title">Quản lý Định hướng học tập</div></header>
    <div class="content">
      <div th:if="${successMsg}" class="flash flash-success"><i class="fa-solid fa-circle-check"></i><span th:text="${successMsg}"></span></div>
      <div th:if="${errorMsg}"   class="flash flash-danger"><i class="fa-solid fa-circle-exclamation"></i><span th:text="${errorMsg}"></span></div>
      <div class="page-hd">
        <div>
          <div class="page-hd-title">Định hướng học tập</div>
          <div class="page-hd-sub">Tạo và quản lý các định hướng học tập theo từng ngành</div>
        </div>
        <a th:href="@{/quan-ly/dinh-huong/them}" class="btn btn-primary">
          <i class="fa-solid fa-plus"></i> Tạo định hướng
        </a>
      </div>
      <div class="card"><div class="card-body" style="padding:0;">
        <div th:if="${danhSach == null or danhSach.empty}" class="empty-state">
          <i class="fa-solid fa-compass"></i>Chưa có định hướng nào.
        </div>
        <table th:if="${danhSach != null and !danhSach.empty}" class="table">
          <thead><tr><th>Tên định hướng</th><th>Ngành</th><th>Thời gian ĐK</th><th>Chế độ</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
          <tbody>
            <tr th:each="dh : ${danhSach}">
              <td><b th:text="${dh.tenDinhHuong}"></b></td>
              <td th:text="${dh.nganh.tenNganh}"></td>
              <td>
                <span th:if="${dh.ngayBatDau != null}"
                      th:text="${#temporals.format(dh.ngayBatDau,'dd/MM/yyyy')} + ' → ' + ${#temporals.format(dh.ngayKetThuc,'dd/MM/yyyy')}"></span>
                <span th:if="${dh.ngayBatDau == null}" class="text-muted">Không giới hạn</span>
              </td>
              <td>
                <span th:if="${dh.cheDoDangKy == 'BAT_BUOC'}" class="badge badge-danger">Bắt buộc</span>
                <span th:if="${dh.cheDoDangKy == 'TU_CHON'}"  class="badge badge-secondary">Tự chọn</span>
              </td>
              <td>
                <span th:if="${dh.trangThai == 'DANG_MO'}" class="badge badge-success">Đang mở</span>
                <span th:if="${dh.trangThai == 'DA_DONG'}"  class="badge badge-secondary">Đã đóng</span>
              </td>
              <td class="flex">
                <a th:href="@{/quan-ly/dinh-huong/sua/{id}(id=${dh.id})}" class="btn btn-outline btn-sm">
                  <i class="fa-solid fa-pen"></i>
                </a>
                <form th:if="${dh.trangThai == 'DANG_MO'}"
                      th:action="@{/quan-ly/dinh-huong/{id}/dong(id=${dh.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-danger btn-sm" title="Đóng">
                    <i class="fa-solid fa-lock"></i>
                  </button>
                </form>
                <form th:if="${dh.trangThai == 'DA_DONG'}"
                      th:action="@{/quan-ly/dinh-huong/{id}/mo(id=${dh.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-success btn-sm" title="Mở lại">
                    <i class="fa-solid fa-lock-open"></i>
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div></div>
    </div>
  </div>
</div></body></html>
